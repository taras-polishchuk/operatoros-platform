<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">OperatorOS four-component architecture</title><desc id="d">Interface Host routes commands to Workspace Service and Execution Service, which write evidence to Evidence Service.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#8ff0b3"/></marker><style>.b{fill:#101b19;stroke:#8ff0b3;stroke-width:2}.t{fill:#e8f0ea;font:700 20px system-ui}.s{fill:#9aada4;font:14px system-ui}.l{stroke:#8ff0b3;stroke-width:2;marker-end:url(#a);fill:none}</style></defs><rect width="900" height="300" rx="18" fill="#08100f"/><rect class="b" x="35" y="115" width="170" height="70" rx="10"/><text class="t" x="55" y="145">Interface Host</text><text class="s" x="55" y="168">CLI · in-process</text><rect class="b" x="270" y="35" width="220" height="70" rx="10"/><text class="t" x="290" y="65">Workspace Service</text><text class="s" x="290" y="88">mutations · projections</text><rect class="b" x="270" y="195" width="220" height="70" rx="10"/><text class="t" x="290" y="225">Execution Service</text><text class="s" x="290" y="248">recoverable Runs</text><rect class="b" x="610" y="115" width="240" height="70" rx="10"/><text class="t" x="630" y="145">Evidence Service</text><text class="s" x="630" y="168">append · seal · verify</text><path class="l" d="M205 135 270 85M205 165 270 215M490 70 610 135M490 230 610 165"/></svg>
