name: Release Candidate Validation

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate label recorded with the evidence artifact
        required: true
        default: v1.0-local
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify candidate
        run: pnpm clean-tree:verify
      - name: Record candidate identity
        run: |
          mkdir -p artifacts/reports/release-candidate
          printf '%s\n' \
            "candidate=${{ inputs.candidate }}" \
            "commit=${GITHUB_SHA}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            > artifacts/reports/release-candidate/identity.txt
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: operatoros-${{ inputs.candidate }}-${{ github.sha }}
          path: |
            artifacts/release-candidates/v1.0/
            artifacts/reports/
            docs/api/
          if-no-files-found: error
