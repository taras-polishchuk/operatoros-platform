name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: Milestone gate to validate
        required: true
        type: choice
        options: [M0, M1, M2, M3, M4]

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm security:scan
      - run: pnpm licenses:report
      - run: pnpm sbom
      - name: Refuse unimplemented gate
        run: |
          test -f "artifacts/evidence/${{ inputs.milestone }}/manifest.json" || {
            echo "No immutable evidence bundle for ${{ inputs.milestone }}" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: operatoros-platform-${{ inputs.milestone }}-candidate
          path: artifacts/evidence/${{ inputs.milestone }}
