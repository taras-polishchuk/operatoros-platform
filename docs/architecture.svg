<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">OperatorOS Platform v1.0 — Architecture</title>
  <desc id="desc">Layered architecture diagram. Bottom layer: Contracts. Middle layer: Evidence, Workspace, and Execution services forming a triangle. Outer perimeter: nine integration packages connected to the services.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#0b1020"/>

  <!-- Title -->
  <text x="40" y="50" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">OperatorOS Platform v1.0 — Architecture</text>
  <text x="40" y="78" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9aa3b2">Frozen architecture SHA-256 1e79049d9ae5a328556378ff8235525cd0f692bfa317fd7da6dc2bcdb1f27610 · 4 authoritative components · 9 integration packages</text>

  <!-- Defs -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="contracts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1c4d"/>
    </linearGradient>
    <linearGradient id="integration" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Layer labels -->
  <text x="20" y="700" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">CONTRACTS (FOUNDATION)</text>
  <text x="20" y="500" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">AUTHORITATIVE SERVICES</text>
  <text x="20" y="160" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">INTEGRATION PACKAGES</text>

  <!-- Layer 1: Contracts (bottom) -->
  <g>
    <rect x="200" y="620" width="800" height="100" rx="14" fill="url(#contracts)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="600" y="660" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Contracts</text>
    <text x="600" y="688" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Public contract vocabulary · 14 entities + 5 envelopes + 1 extension manifest</text>
    <text x="600" y="708" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">@operatoros-platform/contracts</text>
  </g>

  <!-- Layer 2: Authoritative service triangle -->
  <!-- Evidence Service (left) -->
  <g>
    <rect x="120" y="430" width="280" height="120" rx="14" fill="url(#core)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="260" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Evidence Service</text>
    <text x="260" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Appends immutable Event Records</text>
    <text x="260" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Seals Mission Records</text>
    <text x="260" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">evidence-service</text>
  </g>

  <!-- Workspace Service (center) -->
  <g>
    <rect x="460" y="430" width="280" height="120" rx="14" fill="url(#core)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="600" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Workspace Service</text>
    <text x="600" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Validates and commits Workspace mutations</text>
    <text x="600" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Rebuilds projections</text>
    <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">workspace-service</text>
  </g>

  <!-- Execution Service (right) -->
  <g>
    <rect x="800" y="430" width="280" height="120" rx="14" fill="url(#core)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="940" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Execution Service</text>
    <text x="940" y="494" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">8-state Run machine · optimistic concurrency</text>
    <text x="940" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Checkpoint + recovery fences</text>
    <text x="940" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">execution-service</text>
  </g>

  <!-- Internal service-to-service arrows -->
  <line x1="400" y1="490" x2="460" y2="490" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="490" x2="800" y2="490" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="430" x2="260" y2="565" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="600" y1="430" x2="940" y2="565" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Services → Contracts -->
  <line x1="260" y1="550" x2="430" y2="620" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-grey)"/>
  <line x1="600" y1="550" x2="600" y2="620" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-grey)"/>
  <line x1="940" y1="550" x2="770" y2="620" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-grey)"/>
  <text x="475" y="595" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">depends on</text>
  <text x="618" y="595" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">depends on</text>
  <text x="765" y="595" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">depends on</text>

  <!-- Layer 3: Integration packages (perimeter) -->
  <!-- Top row -->
  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="40" y="190" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="130" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Interface Host</text>
      <text x="130" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">interface-host</text>
    </g>
    <g>
      <rect x="240" y="190" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="330" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Governance</text>
      <text x="330" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">governance-service</text>
    </g>
    <g>
      <rect x="440" y="190" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="530" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Agent Execution</text>
      <text x="530" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">agent-execution</text>
    </g>
    <g>
      <rect x="640" y="190" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="730" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Extension Runtime</text>
      <text x="730" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">extension-runtime</text>
    </g>
    <g>
      <rect x="840" y="190" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="930" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Hosted Runtime</text>
      <text x="930" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">hosted-runtime</text>
    </g>
    <g>
      <rect x="1040" y="190" width="140" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="1110" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">v08-importer</text>
      <text x="1110" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">read-only import</text>
    </g>
  </g>

  <!-- Bottom perimeter row -->
  <g font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="240" y="350" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="330" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Recovery</text>
      <text x="330" y="392" text-anchor="middle" font-size="10" fill="#94a3b8">recovery-service</text>
    </g>
    <g>
      <rect x="440" y="350" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="530" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Secrets</text>
      <text x="530" y="392" text-anchor="middle" font-size="10" fill="#94a3b8">secrets-service</text>
    </g>
    <g>
      <rect x="840" y="350" width="180" height="60" rx="10" fill="url(#integration)" stroke="#475569" stroke-width="1"/>
      <text x="930" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Distributed Coord.</text>
      <text x="930" y="392" text-anchor="middle" font-size="10" fill="#94a3b8">distributed-coordination</text>
    </g>
  </g>

  <!-- Integration package connection arrows to services -->
  <!-- Interface Host → Workspace, Execution -->
  <path d="M130,250 Q130,370 260,430" stroke="#22d3ee" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M165,250 Q260,360 460,470" stroke="#22d3ee" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Governance → Workspace, Execution -->
  <line x1="330" y1="250" x2="500" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="380" y1="250" x2="800" y2="455" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Agent Execution → Execution, Workspace -->
  <line x1="530" y1="250" x2="850" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="480" y1="250" x2="600" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Extension Runtime → Workspace, Execution -->
  <line x1="730" y1="250" x2="700" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="780" y1="250" x2="900" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Hosted Runtime → Execution, Workspace -->
  <line x1="930" y1="250" x2="940" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="880" y1="250" x2="740" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- v08-importer → Workspace (read-only) -->
  <path d="M1090,250 Q800,330 700,430" stroke="#22d3ee" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Recovery → Execution, Evidence -->
  <line x1="330" y1="350" x2="320" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="420" y1="380" x2="830" y2="470" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Secrets → Workspace, Execution -->
  <line x1="530" y1="350" x2="540" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="610" y1="380" x2="860" y2="450" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Distributed Coordination → Evidence, Execution -->
  <line x1="930" y1="350" x2="940" y2="430" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="840" y1="380" x2="400" y2="470" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40, 740)">
    <rect x="0" y="0" width="430" height="46" rx="6" fill="#0f172a" stroke="#1f2937"/>
    <text x="14" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Legend</text>
    <line x1="14" y1="30" x2="44" y2="30" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="50" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">integration wires</text>
    <line x1="170" y1="30" x2="200" y2="30" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <text x="206" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">dependency</text>
    <line x1="300" y1="30" x2="330" y2="30" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-grey)"/>
    <text x="336" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">depends on</text>
  </g>

  <!-- Stats -->
  <g transform="translate(900, 740)">
    <rect x="0" y="0" width="260" height="46" rx="6" fill="#0f172a" stroke="#1f2937"/>
    <text x="14" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">v1.0 release evidence</text>
    <text x="14" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">13 packages · 146 tests · 8 auth locked</text>
  </g>
</svg>
